name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Synchronize locked environment
        run: uv sync --locked --group dev

      - name: Verify lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/fidelichem

      - name: Test with branch coverage
        run: >-
          uv run pytest
          --cov=fidelichem
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Build Python distributions
        run: uv build

      - name: Verify installed dependencies
        run: uv pip check
