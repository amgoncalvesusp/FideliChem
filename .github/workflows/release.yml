name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows portable installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true

      - name: Synchronize locked environment
        run: uv sync --locked --group dev

      - name: Build Windows bundle
        run: >-
          uv run --with pyinstaller==6.16.0 python scripts/build_portable.py
          --version "${{ github.ref_name }}"
          --platform windows
          --output-dir release-assets

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress --yes
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & (Get-Command iscc.exe).Source "/DAppVersion=$version" "installer/fidelichem.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: release-assets/FideliChem-*
          if-no-files-found: error

  build-linux:
    name: Linux portable and Debian installers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true

      - name: Synchronize locked environment
        run: uv sync --locked --group dev

      - name: Build Linux bundles
        run: >-
          uv run --with pyinstaller==6.16.0 python scripts/build_portable.py
          --version "${{ github.ref_name }}"
          --platform linux
          --output-dir release-assets

      - name: Upload Linux installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-installers
          path: release-assets/FideliChem-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true

      - name: Download installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build Python distributions
        run: uv build --out-dir release-assets

      - name: Generate SHA256 checksums
        run: >-
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0
          | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" release-assets/*
          --repo "${{ github.repository }}"
          --title "FideliChem ${{ github.ref_name }}"
          --generate-notes
